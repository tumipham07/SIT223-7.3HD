# SonarQube project identity
sonar.projectKey=SIT223-7.3HD
sonar.projectName=SIT223-7.3HD

# Application source code
sonar.sources=src,backend

# Automated test files
sonar.tests=backend
sonar.test.inclusions=backend/**/*.test.js

# Do not analyse generated/dependency/secret-related files
sonar.exclusions=**/node_modules/**,**/coverage/**,dist/**,backend/**/*.test.js,backend/config/**

# Import Jest coverage produced during the Test stage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8